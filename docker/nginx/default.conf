server {
    listen 80;
    server_name _;
    root /var/www/consov2/public;
    index index.php;

    client_max_body_size 2m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # Seul public/ est servi. Tout ce qui n'est pas un fichier existant
    # passe par le point d'entrée unique.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        # Une réponse du chat peut demander plusieurs appels à Claude.
        fastcgi_read_timeout 300s;
        fastcgi_pass php:9000;
    }

    # Autres adresses en .php (ancienne page tablette) : passées au routeur,
    # qui répond 404 à celles qu'il ne connaît pas. Aucun autre script n'est exécuté.
    location ~ \.php$ {
        rewrite ^ /index.php last;
    }
}
