# Environnement de test local. Mêmes versions que la production :
# mysql:5.7.22 et php:7.4-fpm. Tout est exposé sur 127.0.0.1 uniquement.
services:
  db:
    image: mysql:5.7.22
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - db-data:/var/lib/mysql
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./sql/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    ports:
      - "127.0.0.1:${DB_LOCAL_PORT:-3307}:3306"

  php:
    build: docker/php
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - .:/var/www/consov2
    depends_on:
      - db

  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/consov2/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

volumes:
  db-data:
